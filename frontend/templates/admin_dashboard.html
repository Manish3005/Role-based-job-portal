<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="dashboard-page">
    <div class="dashboard-header">
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab(event,'users')">View All Users</button>
            <button class="tab-btn" onclick="openTab(event,'companies')">View All Companies</button>
            <button class="tab-btn" onclick="openTab(event,'jobs')">View All Jobs</button>
        </div>
        <div class="admin-info">
            <div class="admin-text">
                <span class="role">Admin</span>
                <span class="name">Mani Shankar</span>
            </div>
            <div class="profile-icon">👤</div>
        </div>
    </div>
    <div class="dashboard-content">
        <div id="users" class="content active">
            <h2>All Users</h2>
            <table id="users-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Created at</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div id="companies" class="content">
            <h2>All Companies</h2>
            <table id="companies-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Company Name</th>
                    <th>Website</th>
                    <th>Email</th>
                    <th>Contact Number</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div id="jobs" class="content">
            <h2>All Jobs</h2>
            <table id="jobs-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Location</th>
                        <th>Salary</th>
                        <th>Posted Date</th>
                        <th>Company Name</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
